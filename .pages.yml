# Content is stored in GitHub. Pages CMS accesses it using the GitHub App.
media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]
content:
  - name: posts
    label: Journal articles
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, date, category, published, publish_at, publication_approved, campaign_id]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Published date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updated
        label: Last substantive update (optional)
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: Meta description
        type: text
        required: true
      - name: category
        label: Room / category
        type: select
        required: true
        options:
          values: [Living Room, Bedroom, Small Spaces, Home Organization, Lifestyle]
      - name: image
        label: Featured image (must have rights)
        type: image
      - name: image_alt
        label: Image description
        type: string
      - name: pinterest_pin_url
        label: Published Pinterest Pin URL (optional)
        type: string
        description: Link to this story on Pinterest (pin.it short URL or pinterest.com/pin/ URL)
      - name: featured
        label: Featured article
        type: boolean
      - name: published
        label: Publish article
        type: boolean
      - name: publish_at
        label: Scheduled release (UTC, optional)
        type: string
        description: Use YYYY-MM-DDTHH:mm:ssZ. Leave Published off for future releases.
      - name: publication_approved
        label: I approve automatic release at the scheduled time
        type: boolean
        default: false
      - name: campaign_id
        label: Campaign ID (optional)
        type: string
      - name: image_rights_confirmed
        label: I confirmed Journal image accuracy and rights
        type: boolean
        default: false
      - name: related_products
        label: Related affiliate products
        type: reference
        options:
          collection: products
          multiple: true
          max: 8
          search: "title,category"
          value: "{path}"
          label: "{primary}"
      - name: body
        label: Article body
        type: rich-text
        required: true
  - name: products
    label: Amazon affiliate products
    type: collection
    path: src/content/products
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, category, status, published, link_verified, publish_at, publication_approved, campaign_id]
    fields:
      - name: title
        label: Product title
        type: string
        required: true
      - name: card_title
        label: Short card title (optional)
        type: string
        description: Shown only on compact product cards; full title remains on the product page and in SEO.
      - name: rooms
        label: Rooms (choose up to 3)
        type: select
        description: Where does this item belong? Existing Living Room and Bedroom items keep working even if blank.
        options:
          multiple: true
          max: 3
          values: [Living Room, Bedroom, Kitchen & Dining, Bathroom, Home Office, Entryway & Hallway, Outdoor & Balcony]
      - name: product_type
        label: Product type
        type: select
        description: Choose one item type for browsing within the selected rooms.
        options:
          values: [Pillows & Cushions, Throws & Blankets, Vases, Decor Accents, Lighting, Bedding, Rugs & Mats, Storage & Organization, Wall Decor, Mirrors, Tableware, Kitchen Essentials, Bathroom Accessories, Desk Accessories, Compact Furniture, Plants & Planters, Other]
      - name: category
        label: Legacy editorial collection (optional)
        type: select
        default: Lifestyle
        description: Kept for existing products and older links. New Shop navigation uses Rooms and Product type.
        options:
          values: [Living Room, Bedroom, Small Spaces, Home Organization, Lifestyle]
      - name: retailer
        label: Retailer
        type: string
        default: Amazon US
      - name: summary
        label: Original editorial summary
        type: text
        required: true
      - name: best_for
        label: Best suited for
        type: text
      - name: highlights
        label: Original highlights
        type: string
        list: true
      - name: considerations
        label: Helpful buyer notes (public)
        type: text
        description: Write only practical shopper advice (size, materials, care). Never put photo rights, approval reminders, or internal research notes here.
      - name: affiliate_url
        label: Approved Amazon Associates Special Link
        type: string
        description: Use a SiteStripe amzn.to link or full Amazon.com product URL with your tag; no ordinary product links
      - name: link_verified
        label: I personally verified the live Special Link and tracking
        type: boolean
        default: false
      - name: image
        label: Approved uploaded image (optional)
        type: image
        description: Use only images you own or are licensed to show; Amazon product images have specific program restrictions
      - name: image_alt
        label: Image description
        type: string
      - name: image_rights_confirmed
        label: I have rights to display this image
        type: boolean
        default: false
      - name: publish_at
        label: Scheduled release (UTC, optional)
        type: string
        description: Use YYYY-MM-DDTHH:mm:ssZ. Leave Published off for future releases.
      - name: publication_approved
        label: I approve automatic release at the scheduled time
        type: boolean
        default: false
      - name: campaign_id
        label: Campaign ID (optional)
        type: string
      - name: reviewed_at
        label: Editorial review date (optional)
        type: date
        options:
          format: yyyy-MM-dd
      - name: featured
        label: Feature in first collection
        type: boolean
      - name: status
        label: Editorial approval state
        type: select
        required: true
        options:
          values: [draft, approved, hidden]
      - name: published
        label: Publish to the website
        type: boolean
        default: false
      - name: body
        label: Editorial research notes (publicly rendered only on article page? No; internal only)
        type: rich-text
  - name: site
    label: Website settings
    type: file
    path: src/data/site.json
    fields:
      - name: name
        label: Brand name
        type: string
      - name: url
        label: Canonical site URL
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: description
        label: Site SEO description
        type: text
      - name: pinterestUrl
        label: Pinterest profile URL
        type: string
      - name: contactEmail
        label: Public business email (optional)
        type: string
      - name: webAnalyticsToken
        label: Cloudflare Web Analytics token (optional)
        type: string
